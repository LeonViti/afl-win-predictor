# Taskfile.yml
version: '3'

tasks:
  # list default tasks
  default:
    desc: "List available tasks"
    cmds:
      - task --list

  # create data folders in working environment
  setup-data-folders:
    desc: "Create required data directories"
    cmds:
      - echo "Creating data/squiggle_fixture..."
      - mkdir -p data/squiggle_fixture
      - echo "Creating data/complete_datasets..."
      - mkdir -p data/complete_datasets